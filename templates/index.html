<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦊 四地車牌識別 - WebCam 測試</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #0f3460;
        }
        .header h1 { font-size: 24px; color: #e94560; }
        .header p { color: #aaa; margin-top: 5px; font-size: 14px; }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }
        .video-section {
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #0f3460;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        #webcam, #resultCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }
        #resultCanvas { display: none; }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn-start { background: #e94560; color: white; }
        .btn-start:hover { background: #c73e54; }
        .btn-stop { background: #533483; color: white; }
        .btn-stop:hover { background: #422a6b; }
        .btn-upload { background: #0f3460; color: white; }
        .btn-upload:hover { background: #0d2d52; }
        .btn-toggle { background: #16213e; color: #aaa; border: 1px solid #0f3460; }
        .btn-toggle.active { background: #0f3460; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .panel {
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #0f3460;
        }
        .panel h3 {
            font-size: 14px;
            color: #e94560;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #0f3460;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #666;
        }
        .status-dot.connected { background: #4caf50; }
        .status-dot.processing { background: #ff9800; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .stat-item {
            background: rgba(15,52,96,0.3);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-value { font-size: 20px; font-weight: bold; color: #e94560; }
        .stat-label { font-size: 11px; color: #888; margin-top: 3px; }
        .plate-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .plate-item {
            background: rgba(15,52,96,0.3);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .plate-text {
            font-size: 16px;
            font-weight: bold;
            font-family: monospace;
            color: #4caf50;
        }
        .plate-loc {
            font-size: 11.5px;
            color: #b0bec5;
            margin-top: 2px;
            letter-spacing: 0.2px;
        }
        .plate-energy {
            font-size: 11px;
            margin-top: 2px;
            font-weight: 600;
        }
        .plate-meta {
            font-size: 11px;
            color: #888;
            text-align: right;
        }
        .upload-area {
            border: 2px dashed #0f3460;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-area:hover { border-color: #e94560; background: rgba(233,69,96,0.1); }
        .upload-area p { color: #888; font-size: 13px; }
        #fileInput { display: none; }
        .fps-bar {
            height: 4px;
            background: #0f3460;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        .fps-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #e94560);
            transition: width 0.3s;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦊 四地車牌識別系統</h1>
        <p>內地 · 粵Z兩地牌 · 香港 · 澳門 | WebCam 實時測試</p>
    </div>

    <div class="container">
        <div class="video-section">
            <div class="video-wrapper">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="resultCanvas"></canvas>
                <canvas id="captureCanvas" style="display:none;"></canvas>
            </div>
            <div class="controls">
                <button class="btn-start" id="btnStart" onclick="startWebcam()">📷 啟動 WebCam</button>
                <button class="btn-stop" id="btnStop" onclick="stopWebcam()" disabled>⏹ 停止</button>
                <button class="btn-toggle" id="btnDetect" onclick="toggleDetection()">🔍 開始識別</button>
                <button class="btn-upload" onclick="document.getElementById('fileInput').click()">📁 上傳圖片</button>
                <input type="file" id="fileInput" accept="image/*" onchange="handleUpload(event)">
            </div>
            <div class="fps-bar">
                <div class="fps-fill" id="fpsFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h3>📡 連接狀態</h3>
                <div class="status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">未連接</span>
                </div>
            </div>

            <div class="panel">
                <h3>📊 性能統計</h3>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="fpsValue">0</div>
                        <div class="stat-label">FPS</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="latencyValue">0</div>
                        <div class="stat-label">延遲 (ms)</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="platesValue">0</div>
                        <div class="stat-label">檢測車牌</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="framesValue">0</div>
                        <div class="stat-label">處理幀數</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>🚗 識別結果</h3>
                <div class="plate-list" id="plateList">
                    <p style="color: #666; text-align: center; font-size: 13px;">暫無識別結果</p>
                </div>
            </div>

            <div class="panel">
                <h3>📁 上傳測試</h3>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <p>點擊上傳車牌圖片<br>或拖拽到此處</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局變量
        let socket;
        let webcamStream;
        let isDetecting = false;
        let frameInterval;
        let stats = { fps: 0, latency: 0, plates: 0, frames: 0 };
        let lastFrameTime = Date.now();
        let fpsHistory = [];

        // 初始化 WebSocket
        function initSocket() {
            socket = io();
            
            socket.on('connect', () => {
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = '已連接';
            });
            
            socket.on('disconnect', () => {
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = '已斷開';
            });
            
            socket.on('result', (data) => {
                handleResult(data);
            });
            
            socket.on('test_result', (data) => {
                handleTestResult(data);
            });
            
            socket.on('error', (data) => {
                console.error('服務器錯誤:', data.message);
            });
        }

        // 啟動 WebCam
        async function startWebcam() {
            try {
                webcamStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'environment' }
                });
                document.getElementById('webcam').srcObject = webcamStream;
                document.getElementById('btnStart').disabled = true;
                document.getElementById('btnStop').disabled = false;
                document.getElementById('statusText').textContent = 'WebCam 已啟動';
            } catch (err) {
                alert('無法訪問 WebCam: ' + err.message);
            }
        }

        // 停止 WebCam
        function stopWebcam() {
            if (webcamStream) {
                webcamStream.getTracks().forEach(track => track.stop());
                webcamStream = null;
            }
            if (isDetecting) toggleDetection();
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnStop').disabled = true;
            document.getElementById('statusText').textContent = '已連接';
        }

        // 切換識別
        function toggleDetection() {
            isDetecting = !isDetecting;
            const btn = document.getElementById('btnDetect');
            
            if (isDetecting) {
                btn.textContent = '⏸ 暫停識別';
                btn.classList.add('active');
                startDetection();
            } else {
                btn.textContent = '🔍 開始識別';
                btn.classList.remove('active');
                stopDetection();
            }
        }

        // 開始識別循環
        function startDetection() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('captureCanvas');
            const ctx = canvas.getContext('2d');
            
            frameInterval = setInterval(() => {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0);
                    
                    const imageData = canvas.toDataURL('image/jpeg', 0.7);
                    const base64 = imageData.split(',')[1];
                    
                    socket.emit('frame', { image: base64 });
                    lastFrameTime = Date.now();
                    stats.frames++;
                }
            }, 100);  // ~10 FPS
        }

        // 停止識別
        function stopDetection() {
            if (frameInterval) {
                clearInterval(frameInterval);
                frameInterval = null;
            }
        }

        // 處理識別結果
        function handleResult(data) {
            // 計算 FPS
            const now = Date.now();
            const frameTime = now - lastFrameTime;
            const fps = 1000 / frameTime;
            fpsHistory.push(fps);
            if (fpsHistory.length > 10) fpsHistory.shift();
            stats.fps = Math.round(fpsHistory.reduce((a, b) => a + b) / fpsHistory.length);
            stats.latency = data.process_time || 0;
            stats.plates = data.num_plates || 0;
            
            // 更新 UI
            updateStats();
            updatePlateList(data.plates);
            
            // 顯示結果圖片
            if (data.image) {
                const resultCanvas = document.getElementById('resultCanvas');
                const ctx = resultCanvas.getContext('2d');
                const img = new Image();
                img.onload = () => {
                    resultCanvas.width = img.width;
                    resultCanvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    resultCanvas.style.display = 'block';
                    document.getElementById('webcam').style.display = 'none';
                };
                img.src = 'data:image/jpeg;base64,' + data.image;
            }
            
            // 切換回 web cam 顯示
            setTimeout(() => {
                if (isDetecting) {
                    document.getElementById('resultCanvas').style.display = 'none';
                    document.getElementById('webcam').style.display = 'block';
                }
            }, 500);
        }

        // 處理上傳圖片結果
        function handleTestResult(data) {
            const resultCanvas = document.getElementById('resultCanvas');
            const ctx = resultCanvas.getContext('2d');
            const img = new Image();
            img.onload = () => {
                resultCanvas.width = img.width;
                resultCanvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                resultCanvas.style.display = 'block';
                document.getElementById('webcam').style.display = 'none';
            };
            img.src = 'data:image/jpeg;base64,' + data.image;
            
            updatePlateList(data.plates);
            stats.plates = data.num_plates || 0;
            updateStats();
        }

        // 處理上傳
        function handleUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const base64 = e.target.result.split(',')[1];
                socket.emit('test_image', { image: base64 });
            };
            reader.readAsDataURL(file);
        }

        // 更新統計
        function updateStats() {
            document.getElementById('fpsValue').textContent = stats.fps;
            document.getElementById('latencyValue').textContent = Math.round(stats.latency);
            document.getElementById('platesValue').textContent = stats.plates;
            document.getElementById('framesValue').textContent = stats.frames;
            
            const fpsPercent = Math.min(100, (stats.fps / 30) * 100);
            document.getElementById('fpsFill').style.width = fpsPercent + '%';
        }

        // 更新車牌列表
        function updatePlateList(plates) {
            const list = document.getElementById('plateList');
            if (!plates || plates.length === 0) {
                list.innerHTML = '<p style="color: #666; text-align: center; font-size: 13px;">暫無識別結果</p>';
                return;
            }

            const regionColor = {
                mainland: '#4caf50',
                gangao: '#ff9800',
                hk: '#2196f3',
                mo: '#9c27b0',
                unknown: '#888'
            };
            const regionName = {
                mainland: '內地',
                gangao: '粵Z',
                hk: '香港',
                mo: '澳門',
                unknown: '未知'
            };

            list.innerHTML = plates.map(p => {
                const rc = regionColor[p.region] || regionColor.unknown;
                const rn = regionName[p.region] || p.region;
                const valid = p.is_valid
                    ? '<span style="color:#4caf50">✓</span>'
                    : `<span style="color:#e94560" title="${p.validation_note || ''}">✗</span>`;
                const dbl = p.is_double ? ' <span style="color:#ff9800;font-size:10px">雙行</span>' : '';
                // 省 · 市（僅內地/粵Z 有值）
                let loc = '';
                if (p.province) {
                    loc = `<div class="plate-loc">📍 ${p.province}${p.city ? ' · ' + p.city : ''}` +
                          `${p.region_note ? '（' + p.region_note + '）' : ''}</div>`;
                }
                // 能源類型（僅內地新能源牌）
                let energy = '';
                if (p.energy) {
                    const isPure = p.energy_note && p.energy_note.indexOf('純電動') === 0;
                    const ec = isPure ? '#00e676' : '#ffb300';
                    energy = `<div class="plate-energy" style="color:${ec}">⚡ ${p.energy} · ${p.energy_note}</div>`;
                }
                return `
                <div class="plate-item" style="border-left: 3px solid ${rc}">
                    <div>
                        <div class="plate-text" style="color:${rc}">${p.text}</div>
                        ${loc}
                        ${energy}
                        <div style="font-size: 11px; color: #888;">
                            <span style="color:${rc}">${rn}</span> ${valid}${dbl}
                            ${p.color ? '· ' + p.color : ''}
                            ${p.correction_applied ? '· 已糾正' : ''}
                        </div>
                    </div>
                    <div class="plate-meta">
                        <div>辨識: ${(p.confidence * 100).toFixed(1)}%</div>
                        <div>檢測: ${(p.detect_confidence * 100).toFixed(0)}%</div>
                    </div>
                </div>
            `}).join('');
        }

        // 初始化
        window.onload = () => {
            initSocket();
        };
    </script>
</body>
</html>
